name: Feature request
description: Propose a use case or improvement for maintainer review
title: "[Feature] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe what you are trying to do and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would expect the app to do.
    validations:
      required: true
