name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            sdkmanager --sdk_root="$ANDROID_HOME" --channel=0 --install \
              'platforms;android-37.0' 'build-tools;36.0.0' </dev/null
          fi
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run debug unit tests
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --console=plain lintDebug

      - name: Build debug APK
        run: |
          ./gradlew --console=plain assembleDebug
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Stage APK and license notices
        run: |
          mkdir -p "$RUNNER_TEMP/linksonda-debug"
          cp app/build/outputs/apk/debug/app-debug.apk LICENSE NOTICE THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/linksonda-debug/"
          cp -R third_party "$RUNNER_TEMP/linksonda-debug/"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LinkSonda-debug
          path: ${{ runner.temp }}/linksonda-debug/
          if-no-files-found: error
          retention-days: 14
